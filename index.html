<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#C9B4E8">
  <title>Happy Birthday</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <canvas id="sprite-rabbit" class="sprite" width="64" height="64" aria-hidden="true"></canvas>
    <h1>HAPPY<br>BIRTHDAY</h1>
    <canvas id="sprite-beagle" class="sprite" width="64" height="64" aria-hidden="true"></canvas>
  </header>

  <main>
    <div class="stage">
      <section class="birthday-envelope-scene" id="birthday-envelope-scene"
               aria-label="Interactive birthday letter">
        <p class="birthday-envelope-intro" id="envelope-intro">
          A little something for you
          <span>Tap the wax seal to open your letter</span>
        </p>

        <div class="birthday-envelope" id="envelope">
          <article class="birthday-letter" id="letter">
            <div class="birthday-letter-content">
              <p class="birthday-letter-greeting">Dear you,</p>
              <p id="letter-text"></p>
              <p class="birthday-letter-signoff">With love ♡</p>
            </div>
            <span class="birthday-letter-handle" aria-hidden="true">↕</span>
          </article>

          <div class="birthday-envelope-back" aria-hidden="true"></div>
          <div class="birthday-envelope-pocket" aria-hidden="true"></div>
          <div class="birthday-envelope-flap" aria-hidden="true"></div>
          <button class="birthday-wax-seal" id="letter-tab" type="button"
                  aria-label="Open your birthday letter" aria-expanded="false">♡</button>
        </div>

        <p class="birthday-envelope-hint" id="hint" aria-live="polite">
          Tap the wax seal to open ♡
        </p>
      </section>
    </div>
  </main>

  <footer class="shelf-wrap">
    <div class="jars">
      <button class="jar" type="button" data-jar="encouragement">
        <span class="lid" aria-hidden="true"></span>
        <span class="jar-body">
          <canvas class="icon" data-icon="heart" width="16" height="16" aria-hidden="true"></canvas>
        </span>
        <span class="jar-caption">encouragement</span>
      </button>
      <button class="jar" type="button" data-jar="jokes">
        <span class="lid" aria-hidden="true"></span>
        <span class="jar-body">
          <canvas class="icon" data-icon="star" width="16" height="16" aria-hidden="true"></canvas>
        </span>
        <span class="jar-caption">dad jokes</span>
      </button>
      <button class="jar" type="button" data-jar="memories">
        <span class="lid" aria-hidden="true"></span>
        <span class="jar-body">
          <canvas class="icon" data-icon="frame" width="16" height="16" aria-hidden="true"></canvas>
        </span>
        <span class="jar-caption">memory lane</span>
      </button>
    </div>
    <div class="shelf" aria-hidden="true"></div>
  </footer>

  <dialog id="panel" aria-labelledby="panel-title">
    <div class="panel-frame">
      <header class="panel-bar">
        <h2 id="panel-title"></h2>
        <button class="pixel-btn" id="panel-close" type="button">close</button>
      </header>
      <div id="panel-body"></div>
    </div>
  </dialog>

  <script src="content.js"></script>
  <script src="sprites.js"></script>
  <script src="main.js"></script>
</body>
</html>
